<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4e1022">
<title>Prova Cega de Vinhos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='32' fill='%237a1b33'/><path d='M21 13h22c0 13-3.6 21.5-11 22.4C24.6 34.5 21 26 21 13z' fill='%23fff'/><path d='M22.4 22h19.2c-1 7.4-4.1 12.4-9.6 13-5.5-.6-8.6-5.6-9.6-13z' fill='%23c2405f'/><rect x='30.8' y='35' width='2.4' height='11' rx='1' fill='%23fff'/><rect x='24' y='45.5' width='16' height='3' rx='1.5' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    --claret: #7a1b33;
    --claret-deep: #4e1022;
    --claret-soft: #f3e6e6;
    --gold: #a8832f;
    --gold-light: #ecd59a;
    --ok: #2f6b4f;
    --ok-soft: #e5efe8;
    --ink: #241a1d;
    --muted: #6e6264;
    --line: #ebe2d9;
    --paper: #ffffff;
    --bg: #f6f1ea;
    --bg-deep: #ece2d6;
    --alert: #a3202b;
    --shadow: 0 1px 2px rgba(50, 30, 20, .06), 0 6px 18px rgba(50, 30, 20, .06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { font-size: 20px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-deep) 0, var(--bg) 300px) no-repeat, var(--bg);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  #app { max-width: 540px; margin: 0 auto; padding: 14px 16px 64px; }
  h1, h2 { font-family: "Fraunces", Georgia, "Times New Roman", serif; letter-spacing: -.01em; color: var(--claret-deep); }
  h1 { font-weight: 700; font-size: 1.9rem; line-height: 1.12; margin: .45em 0 .35em; }
  h2 { font-weight: 600; font-size: 1.2rem; line-height: 1.25; margin: 0 0 .6em; }
  p { margin: .4em 0; }
  .center { text-align: center; }
  .lead { font-size: 1.1rem; color: var(--muted); }
  .small { font-size: .85rem; color: var(--muted); }
  .eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }

  .card { background: var(--paper); border-radius: 18px; padding: 18px; margin: 14px 0; box-shadow: var(--shadow); }
  .ribbon { background: #f8efdc; color: #5e4510; border-radius: 12px; padding: 8px 12px; text-align: center; font-weight: 700; font-size: .85rem; margin-bottom: 12px; }
  .offline { background: #3b2b30; color: #fff; border-radius: 12px; padding: 9px 12px; text-align: center; font-weight: 700; font-size: .9rem; margin: 0 0 12px; }

  label, .label { display: block; font-weight: 700; margin: 16px 0 6px; }
  input, select {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 14px; color: var(--ink);
    border: 2px solid #e3d8ce; border-radius: 14px; background: #fff;
  }
  input::placeholder { color: #ab9f97; }
  input:focus, select:focus { outline: none; border-color: var(--claret); box-shadow: 0 0 0 4px var(--claret-soft); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--claret); outline-offset: 3px; }

  .btn { display: block; width: 100%; min-height: 60px; margin-top: 16px; padding: 14px 18px; border-radius: 14px; border: 2px solid transparent; font-size: 1.1rem; font-weight: 700; transition: transform .08s ease; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--claret); color: #fff; box-shadow: 0 4px 12px rgba(78, 16, 34, .22); }
  .btn.outline { background: #fff; color: var(--claret); border-color: var(--claret); }
  .btn:disabled { opacity: .35; box-shadow: none; cursor: default; }
  .textbtn { display: block; margin: 14px auto 0; background: none; border: none; color: var(--claret); text-decoration: underline; text-underline-offset: 3px; font-size: .95rem; padding: 10px; min-height: 44px; }
  .textbtn.left { margin: 4px 0 0; padding: 8px 0; }
  .smallbtn { background: var(--claret-soft); border: none; border-radius: 10px; padding: 8px 14px; color: var(--claret-deep); font-weight: 700; font-size: .85rem; min-height: 44px; flex: none; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: .95rem; margin-bottom: 4px; }
  .top .code { display: inline-block; background: var(--paper); color: var(--claret); font-weight: 700; letter-spacing: .14em; padding: 5px 10px 5px 12px; border-radius: 99px; margin-right: 8px; box-shadow: var(--shadow); }

  .brand { text-align: center; padding: 36px 0 8px; }
  .logo { width: 80px; height: 80px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 6px 14px rgba(78, 16, 34, .22)); }
  .logo.sm { width: 52px; height: 52px; }
  .brand h1 { font-size: 2.2rem; margin: .35em 0 .1em; }
  .stage { text-align: center; padding: 20px 0 0; }

  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); min-height: 56px; }
  .list-row:last-child { border-bottom: none; }
  .sub { display: block; color: var(--muted); font-size: .9rem; }
  .empty { color: var(--muted); }
  .names { display: flex; flex-wrap: wrap; gap: 8px; }
  .name { background: var(--bg); border-radius: 99px; padding: 7px 14px; font-weight: 700; font-size: .95rem; }
  .name.me { background: var(--claret-soft); color: var(--claret-deep); }

  .wine-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .wine-item:last-child { border-bottom: none; }
  .wine-item .acts { display: flex; gap: 8px; margin-top: 8px; }
  .share-box { background: var(--bg); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .mine-tag { display: inline-block; background: var(--ok-soft); color: var(--ok); font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .pill { min-height: 50px; padding: 10px 18px; border-radius: 99px; border: 2px solid #e3d8ce; background: #fff; color: var(--ink); font-size: 1rem; font-weight: 700; }
  .pill.on { background: var(--claret); border-color: var(--claret); color: #fff; }
  .pill.on::before { content: "✓ "; }

  .steps { padding-left: 1.3em; margin: .2em 0 .4em; font-size: 1.05rem; }
  .steps li { margin: .55em 0; padding-left: .2em; }
  .steps li::marker { color: var(--claret); font-weight: 700; }

  .waiting { text-align: center; padding: 22px 18px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); color: var(--claret-deep); font-weight: 700; font-size: 1.15rem; margin: 14px 0; }
  .waiting .small { display: block; font-weight: 400; margin-top: 6px; }

  #qr { display: flex; justify-content: center; padding: 6px; }
  #qr img, #qr canvas { max-width: 100%; height: auto; }
  .bigcode { display: block; text-align: center; font-size: 2.6rem; font-weight: 700; letter-spacing: .28em; color: var(--claret); margin: 6px 0 2px; }

  /* The bottle label with arrows: the one bold element */
  .label-wrap { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 14px 0 10px; }
  .arrow { flex: none; width: 56px; height: 72px; border-radius: 14px; border: none; background: var(--paper); box-shadow: var(--shadow); color: var(--claret); font-size: 2rem; font-weight: 700; }
  .arrow:disabled { opacity: .3; box-shadow: none; cursor: default; }
  .bottle-label {
    width: min(210px, 50vw); padding: 14px 10px 12px; text-align: center; background: #fff;
    border: 3px solid var(--claret); border-radius: 50% / 38%;
    box-shadow: inset 0 0 0 6px #fff, inset 0 0 0 8px var(--claret), 0 10px 24px rgba(78, 16, 34, .12);
  }
  .bottle-label .cap { font-size: .9rem; color: var(--muted); }
  .bottle-label .num { font-family: "Fraunces", Georgia, serif; font-size: 4.2rem; font-weight: 700; line-height: 1; color: var(--claret-deep); }
  .bottle-label .of { font-size: .9rem; color: var(--muted); }

  .prompt { text-align: center; font-size: 1.15rem; font-weight: 700; margin: 8px 0; color: var(--claret-deep); }
  .saved { text-align: center; padding: 10px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); font-weight: 700; margin: 8px 0; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .score {
    min-height: 80px; border-radius: 16px; border: 2px solid transparent; background: #fff; color: var(--ink); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px;
  }
  .score .n { font-size: 2.1rem; font-weight: 700; line-height: 1; }
  .score .left { font-size: .8rem; color: var(--muted); margin-top: 5px; }
  .score.sel { background: var(--claret); color: #fff; box-shadow: 0 4px 14px rgba(78, 16, 34, .28); }
  .score.sel .left { color: #fff; }
  .score:disabled { background: transparent; color: #bfb3ad; border: 2px dashed #e3d8ce; box-shadow: none; cursor: default; }
  .score:disabled .left { color: #bfb3ad; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-width: 60px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; display: flex; flex-direction: column; align-items: center; font-size: .8rem; color: var(--muted); }
  .chip b { font-size: 1.3rem; color: var(--ink); }
  .chip.todo { border-style: dashed; }
  .chip.active { border-color: var(--claret); box-shadow: 0 0 0 2px var(--claret); }

  .tag-num { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--claret); display: flex; align-items: center; justify-content: center; font-family: "Fraunces", Georgia, serif; font-weight: 700; font-size: 1.4rem; color: var(--claret-deep); background: #fff; }
  .tag-num.sm { width: 38px; height: 38px; border-width: 2px; font-size: 1.05rem; }
  .reveal-row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
  .reveal-row .rv { flex: 1; min-width: 0; }
  .reveal-row .sub { margin: 4px 0 0 4px; }
  .majority { color: var(--ok); font-weight: 700; }

  .winner { text-align: center; background: linear-gradient(160deg, #84213b 0%, #46101f 100%); color: #fff; border-radius: 22px; padding: 22px 18px; margin: 14px 0; box-shadow: 0 12px 28px rgba(70, 16, 31, .3); }
  .winner .eyebrow { color: var(--gold-light); }
  .winner .wname { font-family: "Fraunces", Georgia, serif; font-size: 1.9rem; font-weight: 700; line-height: 1.15; margin: 8px 0 4px; }
  .winner .avg { font-family: "Fraunces", Georgia, serif; font-size: 3rem; font-weight: 700; margin-top: 10px; line-height: 1; color: var(--gold-light); }
  .winner .soft { opacity: .85; font-size: .9rem; }
  .reveal { animation: pop .7s ease-out both; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  .tabs { display: flex; gap: 4px; background: var(--bg-deep); border-radius: 14px; padding: 4px; margin: 18px 0 4px; }
  .tab { flex: 1; min-height: 48px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 700; font-size: .9rem; padding: 8px 4px; }
  .tab.on { background: var(--paper); color: var(--claret-deep); box-shadow: var(--shadow); }

  details.rank { border-bottom: 1px solid var(--line); }
  details.rank:last-child { border-bottom: none; }
  details.rank summary { display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; list-style: none; }
  details.rank summary::-webkit-details-marker { display: none; }
  details.rank summary::after { content: "›"; color: var(--muted); font-size: 1.5rem; line-height: 1; transition: transform .2s ease; }
  details.rank[open] summary::after { transform: rotate(90deg); }
  .rk { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--bg); color: var(--claret-deep); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.05rem; }
  .rk.r1 { background: linear-gradient(160deg, #dcb75c, #a9832b); color: #fff; }
  .rk.r2 { background: linear-gradient(160deg, #c9ccd1, #989ca3); color: #fff; }
  .rk.r3 { background: linear-gradient(160deg, #d29b6c, #a2673a); color: #fff; }
  .rank .info { flex: 1; min-width: 0; }
  .rank .av { font-size: 1.4rem; font-weight: 700; color: var(--claret-deep); text-align: right; line-height: 1.1; }
  .rank .avl { display: block; font-size: .7rem; font-weight: 400; color: var(--muted); }
  .rank .more { padding: 0 4px 14px 52px; }
  .nw { white-space: nowrap; }
  .nrow { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 1rem; }
  .nrow b { color: var(--claret-deep); }
  .facts { background: var(--bg); border-radius: 10px; padding: 8px 10px; margin: 4px 0 8px; font-size: .9rem; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--bg); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; min-width: 0; }
  .stat .st { font-size: .8rem; color: var(--muted); }
  .stat b { font-family: "Fraunces", Georgia, serif; font-size: 1.1rem; line-height: 1.2; margin-top: 3px; overflow-wrap: anywhere; color: var(--claret-deep); }
  .stat .sd { font-size: .8rem; color: var(--muted); margin-top: 2px; }

  /* All the grades: wines down, people across. Names on the left never move; the grades scroll beside them. */
  .gt { display: flex; align-items: flex-start; }
  .gt-left { flex: none; width: 112px; padding-right: 8px; }
  .gt-right { flex: 1; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .gt-head { height: 30px; }
  .gt-row { height: 64px; }
  .gt-foot { height: 36px; }
  .gt-name { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .gt-name .wn { font-weight: 700; font-size: .88rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .gt-name .wo { font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gt-left .gt-foot { display: flex; align-items: center; font-size: .78rem; font-weight: 700; color: var(--muted); }
  table.gt-table { border-collapse: collapse; }
  .gt-table th, .gt-table td { padding: 0 3px; text-align: center; vertical-align: middle; }
  .gt-table thead th { font-size: .78rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .gt-table thead th.me { color: var(--claret); }
  .gt-table tfoot td { font-size: .78rem; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .gt-table .acol { font-weight: 700; color: var(--claret-deep); padding: 0 4px 0 8px; white-space: nowrap; }
  .pip { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; font-weight: 700; }
  .pip.v0 { background: #f3eded; }
  .pip.v1 { background: #ead2d5; }
  .pip.v2 { background: #c26d80; color: #fff; }
  .pip.v3 { background: var(--claret); color: #fff; }
  .pip.none { color: #bfb3ad; }
  .pip.own { box-shadow: inset 0 0 0 3px #d4a93c; }
  .legend { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: .85rem; color: var(--muted); }
  .pip.sw { width: 20px; height: 20px; border-radius: 6px; }
  .pip.sw.own { box-shadow: inset 0 0 0 2px #d4a93c; }

  .gwine { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .gwine:last-child { border-bottom: none; }
  .gw-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .gp { display: flex; gap: 10px; padding: 4px 0; font-size: .95rem; }
  .gp .gn { flex: none; width: 82px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gp .gv { flex: 1; min-width: 0; }
  .hit { color: var(--ok); font-weight: 700; }
  .miss { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(110, 98, 100, .55); }

  #toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%);
    width: min(520px, calc(100% - 28px)); padding: 16px 18px; border-radius: 14px; font-weight: 700; font-size: 1.05rem;
    background: var(--alert); color: #fff; box-shadow: 0 10px 30px rgba(40, 10, 20, .3); transition: transform .25s ease; z-index: 10; text-align: center;
  }
  #toast.ok { background: var(--ok); }
  #toast.show { transform: translate(-50%, 0); }
  #toast:not(.show) { visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }

  /* In-app dialog (replaces the browser's "site says..." boxes) */
  #modal { position: fixed; inset: 0; background: rgba(40, 12, 22, .5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; }
  #modal[hidden] { display: none; }
  #modal .sheet { background: #fff; border-radius: 22px; padding: 22px 18px 18px; width: min(520px, 100%); max-height: 85vh; overflow: auto; font-size: 1.15rem; box-shadow: 0 20px 50px rgba(40, 12, 22, .3); }
  #modal .sheet ul { padding-left: 1.2em; margin: .5em 0; }
  #modal .btns { display: flex; gap: 12px; }
  #modal .btns .btn { flex: 1; }
</style>
</head>
<body>
<div id="app"><p class="center lead" style="margin-top:40vh">A carregar…</p></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mText">
  <div id="mText"></div>
  <div class="btns"><button class="btn outline" id="mNo">Cancelar</button><button class="btn primary" id="mYes">Sim</button></div>
</div></div>

<datalist id="dl-country">
  <option>Portugal</option><option>Espanha</option><option>França</option><option>Itália</option><option>Alemanha</option>
  <option>Áustria</option><option>Grécia</option><option>Argentina</option><option>Chile</option><option>Brasil</option>
  <option>Uruguai</option><option>Estados Unidos</option><option>África do Sul</option><option>Austrália</option><option>Nova Zelândia</option>
</datalist>

  <option>Bairrada</option><option>Beira Interior</option><option>Távora-Varosa</option><option>Lisboa</option><option>Tejo</option>
  <option>Península de Setúbal</option><option>Alentejo</option><option>Algarve</option><option>Madeira</option><option>Açores</option>
  <option>Colares</option><option>Bucelas</option><option>Rioja</option><option>Ribera del Duero</option><option>Rías Baixas</option>

  <option>Loire</option><option>Toscana</option><option>Piemonte</option><option>Mendoza</option>

  <option>Tinto Cão</option><option>Sousão</option><option>Baga</option><option>Castelão</option><option>Trincadeira</option>
  <option>Alicante Bouschet</option><option>Jaen</option><option>Alfrocheiro</option><option>Tinta Miúda</option><option>Syrah</option>

</datalist>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* Firebase settings for the "prova-vinhos" project */
const firebaseConfig = {
  apiKey: "AIzaSyB6nrk86BwFaabgN4bET2LJ2pSsdqzcG9U",
  authDomain: "prova-vinhos.firebaseapp.com",
  projectId: "prova-vinhos",
  storageBucket: "prova-vinhos.firebasestorage.app",

};

/* Phases of a tasting:
   setup   -> everyone joins and registers the bottles they brought (a bottle can belong to several people)
   prep    -> list is closed; wines go into identical bottles, which are shuffled and numbered by hand
   tasting -> everyone scores any bottle, in any order, and may guess its details; ends when everyone scored everything
   reveal  -> everyone says which wine was in each numbered bottle; the majority decides
   done    -> everyone sees the results

   Data: events/{code} with subcollections guests, wines and ratings.
   ratings/{guestId} = { scores: {n: 0-10}, guesses: {n: {...}}, reveal: {n: wineId} } */

const MAX_SCORE = 10;   // scores go from 0 to 10
const PER_SCORE = 2;    // each score can be given at most twice
const MAX_WINES = 20;   // 11 scores x 2 = 22, enough for 20 bottles

/* Bump APP_VERSION and write the same text in version.txt on every change, so phones pick up the new page. */
const APP_VERSION = '2026-10-19.3';

/* Only phones that opened the host link (?anfitriao=...) can create tastings.
   This is the SHA-256 of that secret, so the secret itself is not in the page. */
const HOST_HASH = '49214f3a6d9f8fdf74917bea9434172be1b120fa94d96739f5c2c57320a5e5dd';

const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.has('demo');

const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let fs = null;

const S = {
  view: 'home', joinCode: null, canCreate: false, hostKey: null,
  code: null, guestId: null, hostPin: null, isHost: false,
  event: null, guests: [], wines: [], ratings: {}, guesses: {}, reveals: {}, guestsLoaded: false,
  sel: null, showGuess: false, showMore: false, shareEdit: null, resTab: 'rank',
  offline: false, pending: false, unsub: [], resub: null, lastKey: null, clearDraft: false
};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const fmt = v => v == null ? '–' : v.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const listPt = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9.,]+/g, ' ').trim();
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* The phone remembers which tasting it is in, so that closing the browser, a reload or a dead battery
   never costs anyone their place: the link, the QR code or "Voltar à prova" bring them straight back. */
const SKEY = 'blindWineTasting.v2';
const RESUME_HOURS = 24;
function loadSession(hours) {
  try {
    const s = JSON.parse(localStorage.getItem(SKEY));
    return s && s.code && s.guestId && s.savedAt && Date.now() - s.savedAt < (hours || 48) * 36e5 ? s : null;
  } catch (e) { return null; }
}
function saveSession() { if (DEMO || !S.code) return; try { localStorage.setItem(SKEY, JSON.stringify({ code: S.code, guestId: S.guestId, hostPin: S.hostPin, savedAt: Date.now() })); } catch (e) {} }
function clearSession() { if (DEMO) return; try { localStorage.removeItem(SKEY); } catch (e) {} }
// The address always says which tasting this phone is in; the host link keeps its key, so a reload stays a host link.
function setUrl(code) {
  if (DEMO) return;
  const q = new URLSearchParams();
  if (code) q.set('e', code);
  if (S.hostKey) q.set('anfitriao', S.hostKey);
  try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch (e) {}
}
const evRef = () => fs.collection('events').doc(S.code);
const wineRef = id => evRef().collection('wines').doc(id);
const myRatingRef = () => evRef().collection('ratings').doc(S.guestId);
const guestName = id => { const g = S.guests.find(x => x.id === id); return g ? g.name : 'alguém que saiu'; };
const activeGuests = () => S.guests.filter(g => !g.left);
const myScores = () => S.ratings[S.guestId] || {};
const owners = w => Array.isArray(w.guestIds) && w.guestIds.length ? w.guestIds : (w.guestId ? [w.guestId] : []);
const owns = (w, id) => owners(w).indexOf(id) >= 0;
const broughtBy = w => listPt(owners(w).map(guestName));
const maxScore = () => (S.event && S.event.maxScore) || MAX_SCORE;
const perScore = () => (S.event && S.event.perScore) || PER_SCORE;

let toastTimer = null;
function toast(text, kind) {
  $toast.textContent = text;
  $toast.className = 'show' + (kind === 'ok' ? ' ok' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.className = kind === 'ok' ? 'ok' : ''; }, 4000);
}

/* In-app dialog. ask() resolves true/false; tell() only has an OK button. */
const $modal = document.getElementById('modal');
function ask(html, yes, no) {
  return new Promise(resolve => {
    document.getElementById('mText').innerHTML = html;
    const bYes = document.getElementById('mYes'), bNo = document.getElementById('mNo');
    bYes.textContent = yes || 'Sim';
    bNo.textContent = no || 'Cancelar';
    bNo.style.display = no === null ? 'none' : '';
    const done = v => { $modal.hidden = true; bYes.onclick = bNo.onclick = null; resolve(v); };
    bYes.onclick = () => done(true);
    bNo.onclick = () => done(false);
    $modal.hidden = false;
    bYes.focus();
  });
}
const tell = html => ask(html, 'OK', null);

/* Firestore applies a write on this phone at once and sends it as soon as the connection allows, so the screen
   never waits for the server: a weak connection can't freeze the buttons. A refused write is reported. */
function send(p) {
  return Promise.resolve(p).catch(err => { console.error(err); toast('Não foi possível guardar. Verifique a internet.'); });
}
/* Reads that need the server (joining, creating) give up after a while instead of hanging. */
function within(p, ms) {
  return Promise.race([p, new Promise((_, fail) => setTimeout(() => fail(new Error('timeout')), ms || 12000))]);
}

function randCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I or O, easy to read
  let c = ''; for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}

/* ---------- wine details and guesses ---------- */
const FIELDS = [
  { k: 'name', label: 'Nome', list: 'dl-wines' },
  { k: 'country', label: 'País', list: 'dl-country' },
  { k: 'region', label: 'Região', list: 'dl-region' },
  { k: 'year', label: 'Ano', mode: 'numeric', half: true },
  { k: 'abv', label: 'Teor alcoólico (%)', mode: 'decimal', half: true },
  { k: 'grapes', label: 'Castas', list: 'dl-grape', hint: 'ex.: Touriga Nacional, Tinta Roriz' }
];
const DETAIL_FIELDS = FIELDS.filter(f => f.k !== 'name');
const textHit = (g, r) => { g = norm(g); r = norm(r); return !!g && !!r && (g === r || (g.length >= 3 && r.indexOf(g) >= 0) || (r.length >= 3 && g.indexOf(r) >= 0)); };
const splitGrapes = s => String(s || '').split(/[,;/+]|\se\s/i).map(x => x.trim()).filter(Boolean);
const toNum = s => { const v = parseFloat(String(s == null ? '' : s).replace(',', '.')); return isNaN(v) ? null : v; };
const abvText = v => String(v).replace('.', ',') + '%';
const factsLine = w => [w.country, w.region, w.year, w.abv ? abvText(w.abv) : '', w.grapes].filter(Boolean).join(' · ');

// null when there is nothing to compare; otherwise { ok, note }
function judge(k, guess, wine) {
  const real = wine[k];
  if (guess == null || !String(guess).trim() || real == null || !String(real).trim()) return null;
  if (k === 'year') return { ok: parseInt(guess, 10) === parseInt(real, 10) };
  if (k === 'abv') { const a = toNum(guess), b = toNum(real); return { ok: a != null && b != null && Math.abs(a - b) <= 0.5 }; }
  if (k === 'grapes') {
    const realList = splitGrapes(real), hits = splitGrapes(guess).filter(g => realList.some(r => textHit(g, r))).length;
    return { ok: hits > 0, note: hits + ' de ' + realList.length };
  }
  return { ok: textHit(guess, real) };
}

/* Keep the screen on while the phone is being used during the tasting, and let it sleep after a few
   untouched minutes so a long evening doesn't drain the battery. */
let wakeLock = null, wakeBusy = false, lastTouch = Date.now();
async function syncWakeLock() {
  if (!('wakeLock' in navigator) || wakeBusy) return;
  const want = !!(S.event && ['prep', 'tasting', 'reveal'].indexOf(S.event.phase) >= 0) &&
    document.visibilityState === 'visible' && Date.now() - lastTouch < 4 * 60000;
  wakeBusy = true;
  try {
    if (want && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch (e) {} finally { wakeBusy = false; }
}
['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { lastTouch = Date.now(); if (!wakeLock) syncWakeLock(); }, { passive: true }));
document.addEventListener('visibilitychange', syncWakeLock);
setInterval(syncWakeLock, 30000);

/* Firestore sometimes loses its connection and then waits half a minute before trying again, so the phone
   misses live changes. If this phone's data has not been confirmed by the server for a few seconds, or the
   screen has just come back on, reconnect at once. Reconnecting costs no extra reads. */
let staleTimer = null, offlineTimer = null, outOfSync = false;
function setOffline(v) { if (S.offline !== v) { S.offline = v; render(); } }
function reconnect() {
  clearTimeout(staleTimer); staleTimer = null;
  if (DEMO || !fs || !fs.disableNetwork) return;
  fs.disableNetwork().then(() => fs.enableNetwork()).catch(() => {});
  staleTimer = setTimeout(() => { staleTimer = null; if (outOfSync) reconnect(); }, 8000);
}
function watchSync(snap) {
  outOfSync = snap.metadata.fromCache;
  if (!outOfSync) {
    clearTimeout(staleTimer); staleTimer = null;
    clearTimeout(offlineTimer); offlineTimer = null;
    setOffline(false);
  } else {
    if (!staleTimer) staleTimer = setTimeout(reconnect, 4000);
    if (!offlineTimer) offlineTimer = setTimeout(() => { offlineTimer = null; if (outOfSync) setOffline(true); }, 6000);
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.code) reconnect(); });
// Safety net for a connection that looks healthy but has quietly stopped delivering: refresh it every 20 s while a
// tasting is on screen. Firestore resumes where it left off, so this costs no extra reads.
setInterval(() => { if (S.code && document.visibilityState === 'visible') reconnect(); }, 20000);
window.addEventListener('offline', () => setOffline(true));
window.addEventListener('online', () => { setOffline(false); if (S.code) reconnect(); });

/* ---------- live data ---------- */
function stopListening() {
  S.unsub.forEach(u => { try { u(); } catch (e) {} });
  S.unsub = [];
  clearTimeout(S.resub); S.resub = null;
  clearTimeout(staleTimer); staleTimer = null;
  clearTimeout(offlineTimer); offlineTimer = null; outOfSync = false;
}

// Leave the tasting screen. The phone keeps remembering the tasting (so "Voltar à prova" works) unless told to forget it.
function leaveEvent(forget) {
  stopListening();
  if (forget) clearSession();
  Object.assign(S, { code: null, guestId: null, hostPin: null, isHost: false, event: null, guests: [], wines: [], ratings: {}, guesses: {}, reveals: {},
    guestsLoaded: false, sel: null, showGuess: false, showMore: false, shareEdit: null, resTab: 'rank' });
  syncWakeLock();
}

// A listener that fails (lost connection, busy server) stops for good, so start them all again shortly.
function listenerFailed(err) {
  console.error(err);
  if (S.resub || !S.code) return;
  S.resub = setTimeout(() => { S.resub = null; if (S.code) { stopListening(); subscribe(); } }, 4000);
}

function subscribe() {
  const ev = evRef();
  if (!DEMO) {
    S.unsub.push(ev.onSnapshot({ includeMetadataChanges: true }, watchSync, () => {}));
    // The first poll opened while the listeners start up can get stuck for ~30 s without the SDK noticing.
    // Reconnecting once, after start-up settles, replaces it with a healthy one.
    const t = setTimeout(reconnect, 3000);
    S.unsub.push(() => clearTimeout(t));
  }
  S.unsub.push(ev.onSnapshot(snap => {
    if (!snap.exists) { leaveEvent(true); setUrl(null); S.view = 'home'; toast('Esta prova já terminou.'); render(true); return; }
    const prev = S.event;
    S.event = snap.data();
    S.isHost = !!(S.hostPin && S.event.hostPin === S.hostPin);
    saveSession();
    const moved = prev && prev.phase !== S.event.phase;
    if (moved) {
      S.shareEdit = null; S.showGuess = false; S.sel = null; S.resTab = 'rank';
      const ph = S.event.phase;
      if (ph === 'tasting' && prev.phase === 'prep') { toast('A prova começou.', 'ok'); buzz([80, 80, 80]); }
      else if (ph === 'reveal') buzz([80, 80, 80]);
      else if (ph === 'done') buzz([150, 80, 150]);
    }
    render();
    if (moved) window.scrollTo(0, 0);
  }, listenerFailed));
  S.unsub.push(ev.collection('guests').onSnapshot(q => {
    S.guests = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
    S.guestsLoaded = true;
    if (S.guestId && !S.guests.some(g => g.id === S.guestId)) {
      // Removed by the host, or the whole tasting is gone: wait a moment so the second case can show itself first.
      const code = S.code;
      setTimeout(() => {
        if (S.code !== code || S.guests.some(g => g.id === S.guestId)) return;
        leaveEvent(true); S.joinCode = code; S.view = 'join'; setUrl(code);
        toast('Escreva o seu nome para entrar.'); render(true);
      }, 2000);
    }
    render();
  }, listenerFailed));
  S.unsub.push(ev.collection('wines').onSnapshot(q => {
    S.wines = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.number || 0) - (b.number || 0) || (a.createdAt || 0) - (b.createdAt || 0));
    render();
  }, listenerFailed));
  S.unsub.push(ev.collection('ratings').onSnapshot(q => {
    const r = {}, g = {}, v = {};
    q.docs.forEach(d => { const x = d.data(); r[d.id] = x.scores || {}; g[d.id] = x.guesses || {}; v[d.id] = x.reveal || {}; });
    S.ratings = r; S.guesses = g; S.reveals = v; render();
  }, listenerFailed));
}

// Names match without caring about capitals or accents: "joao" finds "João".
async function findGuest(code, name) {
  const snap = await within(fs.collection('events').doc(code).collection('guests').get());
  const n = norm(name);
  return snap.docs.find(d => norm(d.data().name) === n) || null;
}

function enterEvent(code, guestId, pin) {
  S.code = code; S.guestId = guestId; S.hostPin = pin || null;
  saveSession(); setUrl(code); subscribe(); render(true);
}

// The tasting must exist on the server before anyone listens to it: the database rules only allow reading its
// guests, bottles and votes once it does. So this waits for the server, with a time limit.
async function newEvent(code, name) {
  const ev = fs.collection('events').doc(code);
  const g = ev.collection('guests').doc();
  const pin = String(Math.floor(1000 + Math.random() * 9000));
  await within(ev.set({ createdAt: Date.now(), hostPin: pin, hostGuest: g.id, phase: 'setup', total: 0, maxScore: MAX_SCORE, perScore: PER_SCORE }));
  await within(g.set({ name, joinedAt: Date.now() }));
  return { gid: g.id, pin };
}

/* Who has not scored what yet (only people still at the table). */
function missingVotes() {
  const total = S.event.total, out = [];
  activeGuests().forEach(g => {
    const sc = S.ratings[g.id] || {}, miss = [];
    for (let k = 1; k <= total; k++) if (sc[k] == null) miss.push(k);
    if (miss.length) out.push({ g, miss });
  });
  return out;
}

/* Reveal by majority: count every person's "bottle k is wine X" votes and give each bottle the most-voted
   wine that is still free. Ties go to the host's vote, then to the order the wines were registered. */
function majority() {
  const tally = {}, order = {};
  S.wines.forEach((w, i) => { order[w.id] = i; });
  Object.keys(S.reveals).forEach(gid => {
    const map = S.reveals[gid] || {};
    Object.keys(map).forEach(k => {
      const wid = map[k];
      if (!wid || order[wid] == null) return;
      const key = k + '|' + wid;
      const t = tally[key] || (tally[key] = { k: +k, wid, n: 0, host: 0 });
      t.n++; if (S.event.hostGuest && gid === S.event.hostGuest) t.host = 1;
    });
  });
  const byBottle = {}, used = {};
  Object.values(tally).sort((a, b) => b.n - a.n || b.host - a.host || order[a.wid] - order[b.wid]).forEach(t => {
    if (t.k > S.event.total || byBottle[t.k] || used[t.wid]) return;
    byBottle[t.k] = t; used[t.wid] = true;
  });
  return byBottle;
}
function bottlesWithoutMajority() {
  const m = majority(), left = [];
  for (let k = 1; k <= S.event.total; k++) if (!m[k]) left.push(k);
  return left;
}

function firstUnscored() {
  const mine = myScores();
  for (let k = 1; k <= S.event.total; k++) if (mine[k] == null) return k;
  return 1;
}

/* ---------- actions (buttons) ---------- */
const A = {
  home() { S.view = 'home'; render(true); },
  goCreate() { S.view = 'create'; render(true); },
  goHostLogin() { S.view = 'hostLogin'; render(true); },
  reload() { location.reload(); },

  resume() {
    const s = loadSession(RESUME_HOURS);
    if (s) enterEvent(s.code, s.guestId, s.hostPin); else render(true);
  },

  goJoin() {
    const c = val('code').toUpperCase().replace(/[^A-Z]/g, '');
    if (c.length !== 4) return toast('Escreva o código da prova (4 letras).');
    const s = loadSession();
    if (s && s.code === c) return enterEvent(c, s.guestId, s.hostPin); // this phone was already in it
    S.joinCode = c; S.view = 'join'; setUrl(c); render(true);
  },

  async join() {
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    const code = S.joinCode;
    const ev = await within(fs.collection('events').doc(code).get());
    if (!ev.exists) { S.view = 'home'; setUrl(null); render(true); return toast('Não existe nenhuma prova com o código ' + code + '.'); }
    const saved = loadSession();
    const guests = fs.collection('events').doc(code).collection('guests');
    const same = await findGuest(code, name);
    let gid;
    if (same) {
      // Same name: the same person coming back (new phone, dead battery), or someone else with that name.
      const known = saved && saved.code === code && saved.guestId === same.id;
      if (!known && !await ask('Já há <b>' + esc(same.data().name) + '</b> nesta prova.<br>É você?', 'Sou eu', 'Não sou')) {
        return toast('Escreva também o apelido.');
      }
      gid = same.id;
      if (same.data().left) send(guests.doc(gid).update({ left: false }));
    } else {
      const ref = guests.doc();
      send(ref.set({ name, joinedAt: Date.now() }));
      gid = ref.id;
    }
    enterEvent(code, gid, saved && saved.code === code ? saved.hostPin : null);
  },

  async create() {
    if (!S.canCreate) return;
    const name = val('name');
    if (!name) return toast('Escreva o seu nome.');
    let code = null;
    for (let i = 0; i < 8 && !code; i++) {
      const c = randCode();
      const s = await within(fs.collection('events').doc(c).get());
      if (!s.exists) code = c;
    }
    if (!code) return toast('Não funcionou. Tente outra vez.');
    const r = await newEvent(code, name);
    enterEvent(code, r.gid, r.pin);
  },

  // The host link is the proof of being the host, so getting a tasting back only needs its code.
  async hostLogin() {
    if (!S.canCreate) return;
    const code = val('code').toUpperCase().replace(/[^A-Z]/g, '');
    if (code.length !== 4) return toast('Escreva o código da prova (4 letras).');
    const ref = fs.collection('events').doc(code);
    const ev = await within(ref.get());
    if (!ev.exists) return toast('Não existe nenhuma prova com o código ' + code + '.');
    const e = ev.data();
    let gid = e.hostGuest || null;
    if (gid && !(await within(ref.collection('guests').doc(gid).get())).exists) gid = null;
    if (!gid) {
      const g = ref.collection('guests').doc();
      send(g.set({ name: 'Anfitrião', joinedAt: Date.now() }));
      send(ref.update({ hostGuest: g.id }));
      gid = g.id;
    }
    enterEvent(code, gid, e.hostPin);
  },

  pill(d, el) {
    const on = !el.classList.contains('on');
    el.classList.toggle('on', on); el.setAttribute('aria-pressed', on);
  },
  toggleMore() { S.showMore = !S.showMore; render(true); },

  addWine() {
    if (S.wines.length >= MAX_WINES) return toast('Já há ' + MAX_WINES + ' garrafas, o máximo.');
    const name = val('wName');
    if (!name) return toast('Escreva o nome do vinho.');
    const picked = Array.from(document.querySelectorAll('#newOwners .pill.on')).map(b => b.dataset.gid);
    const ids = S.isHost ? picked : [S.guestId].concat(picked.filter(g => g !== S.guestId));
    if (!ids.length) return toast('Escolha de quem é a garrafa.');
    const wine = { guestId: ids[0], guestIds: ids, name, number: null, createdAt: Date.now() };
    DETAIL_FIELDS.forEach(f => { wine[f.k] = val('w_' + f.k); });
    wine.year = wine.year.replace(/\D/g, '').slice(0, 4);
    // set() on a new id rather than add(): if the connection drops mid-save, the retry can't fail as a duplicate.
    send(evRef().collection('wines').doc().set(wine));
    S.clearDraft = true; S.showMore = false; render(true);
    toast('Garrafa registada.', 'ok');
  },

  async delWine(d) {
    const w = S.wines.find(x => x.id === d.id);
    if (!w || !await ask('Remover a garrafa <b>' + esc(w.name) + '</b>?', 'Remover')) return;
    if (S.shareEdit === d.id) S.shareEdit = null;
    send(wineRef(d.id).delete());
  },

  editOwners(d) { S.shareEdit = S.shareEdit === d.id ? null : d.id; render(true); },

  toggleOwner(d) {
    const w = S.wines.find(x => x.id === d.id);
    if (!w) return;
    let ids = owners(w).slice();
    if (ids.indexOf(d.gid) >= 0) {
      if (ids.length === 1) return toast('Escolha pelo menos uma pessoa.');
      ids = ids.filter(x => x !== d.gid);
    } else ids.push(d.gid);
    if (!S.isHost && ids.indexOf(S.guestId) < 0) S.shareEdit = null;
    send(wineRef(w.id).update({ guestIds: ids, guestId: ids[0] }));
  },

  async delGuest(d) {
    if (!await ask('Remover <b>' + esc(guestName(d.id)) + '</b>?', 'Remover')) return;
    const b = fs.batch();
    b.delete(evRef().collection('guests').doc(d.id));
    b.delete(evRef().collection('ratings').doc(d.id));
    S.wines.filter(w => owns(w, d.id)).forEach(w => {
      const rest = owners(w).filter(x => x !== d.id);
      if (rest.length) b.update(wineRef(w.id), { guestIds: rest, guestId: rest[0] });
      else b.delete(wineRef(w.id));
    });
    send(b.commit());
  },

  // During the tasting someone who went home can be taken out of the "still missing" list.
  async markLeft(d) {
    if (!await ask('<b>' + esc(guestName(d.id)) + '</b> já saiu?', 'Já saiu')) return;
    send(evRef().collection('guests').doc(d.id).update({ left: true }));
  },

  async closeList() {
    const n = S.wines.length;
    if (n < 2) return toast('São precisas pelo menos 2 garrafas.');
    if (!await ask('Fechar a lista com <b>' + n + ' garrafas</b>?', 'Fechar')) return;
    const b = fs.batch();
    S.wines.forEach(w => b.update(wineRef(w.id), { number: null }));
    b.update(evRef(), { phase: 'prep', total: n, maxScore: MAX_SCORE, perScore: PER_SCORE });
    send(b.commit());
  },

  async backToSetup() {
    if (!await ask('Voltar à lista de garrafas?', 'Voltar')) return;
    send(evRef().update({ phase: 'setup' }));
  },

  async beginTasting() {
    if (!await ask('Começar a prova?', 'Começar')) return;
    send(evRef().update({ phase: 'tasting', startedAt: Date.now() }));
  },

  go(d) {
    const n = parseInt(d.n, 10);
    if (n >= 1 && n <= S.event.total) { S.sel = n; render(true); }
  },
  toggleGuess() { S.showGuess = !S.showGuess; render(true); },

  score(d) {
    const n = S.sel;
    const s = parseInt(d.s, 10);
    const mine = myScores();
    const usedElsewhere = Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;
    if (usedElsewhere >= perScore()) return toast('Já deu ' + s + ' a ' + perScore() + ' vinhos.');
    buzz(25);
    S.ratings[S.guestId] = Object.assign({}, mine, { [n]: s });
    render(true);
    send(myRatingRef().set({ scores: { [n]: s } }, { merge: true }));
    const me = S.guests.find(g => g.id === S.guestId);
    if (me && me.left) send(evRef().collection('guests').doc(S.guestId).update({ left: false }));
  },

  async finish() {
    const miss = missingVotes();
    if (miss.length) {
      return tell('<b>Falta votar:</b><ul>' + miss.map(m =>
        `<li>${esc(m.g.name)}: ${m.miss.length === 1 ? 'vinho ' : 'vinhos '}${listPt(m.miss.map(String))}</li>`).join('') + '</ul>');
    }
    if (!await ask('Terminar a prova?', 'Terminar')) return;
    send(evRef().update({ phase: 'reveal' }));
  },

  async showResults() {
    const left = bottlesWithoutMajority();
    if (left.length) return tell('Falta escolher o vinho da garrafa ' + listPt(left.map(String)) + '.');
    if (!await ask('Mostrar os resultados?', 'Mostrar')) return;
    const m = majority();
    const b = fs.batch();
    S.wines.forEach(w => {
      let n = null;
      Object.keys(m).forEach(k => { if (m[k].wid === w.id) n = +k; });
      if (w.number !== n) b.update(wineRef(w.id), { number: n });
    });
    b.update(evRef(), { phase: 'done', finishedAt: Date.now() });
    send(b.commit());
  },

  async backToTasting() {
    if (!await ask('Voltar à prova?', 'Voltar')) return;
    send(evRef().update({ phase: 'tasting' }));
  },

  async reopen() {
    if (!await ask('Voltar à revelação?', 'Voltar')) return;
    send(evRef().update({ phase: 'reveal' }));
  },

  tab(d) { S.resTab = d.t; render(true); },

  async leave() {
    if (DEMO) { if (await ask('Recomeçar a demonstração?', 'Recomeçar')) location.reload(); return; }
    if (!await ask('Sair da prova?', 'Sair')) return;
    leaveEvent(false); setUrl(null); S.view = 'home'; render(true);
  },

  async newTasting() {
    if (!await ask('Criar uma nova prova?', 'Criar')) return;
    leaveEvent(false); setUrl(null); S.view = 'create'; render(true);
  }
};

function saveGuess(n) {
  const g = {};
  FIELDS.forEach(f => { g[f.k] = val('g_' + f.k); });
  const all = Object.assign({}, S.guesses[S.guestId] || {});
  all[n] = g; S.guesses[S.guestId] = all;
  send(myRatingRef().set({ guesses: { [n]: g } }, { merge: true }));
}

function saveRevealVote(k, wineId) {
  const total = S.event.total, mine = Object.assign({}, S.reveals[S.guestId] || {}), full = {};
  for (let i = 1; i <= total; i++) {
    let v = mine[i] || '';
    if (wineId && v === wineId) v = '';   // a wine can only be in one bottle
    full[i] = i === k ? (wineId || '') : v;
  }
  S.reveals[S.guestId] = full;
  send(myRatingRef().set({ reveal: full }, { merge: true }));
}

function fieldInputs(fields, prefix, values, extra) {
  const one = f => `<div><label for="${prefix + f.k}">${f.label}</label>
    <input id="${prefix + f.k}" ${extra(f)} maxlength="80" value="${esc(values[f.k] || '')}"
      ${f.list ? `list="${f.list}"` : ''} ${f.mode ? `inputmode="${f.mode}"` : ''} ${f.hint ? `placeholder="${esc(f.hint)}"` : ''} autocomplete="off"></div>`;
  let html = '', i = 0;
  while (i < fields.length) {
    if (fields[i].half && fields[i + 1] && fields[i + 1].half) { html += `<div class="grid2">${one(fields[i])}${one(fields[i + 1])}</div>`; i += 2; }
    else { html += one(fields[i]); i++; }
  }
  return html;
}

function tastingView(me) {
  const total = S.event.total;
  if (!S.sel || S.sel > total) S.sel = firstUnscored();
  const n = S.sel;
  const mine = myScores();
  const my = mine[n];
  const per = perScore();
  const usedElsewhere = s => Object.keys(mine).filter(k => +k !== n && mine[k] === s).length;
  const done = Object.keys(mine).filter(k => +k <= total && mine[k] != null).length;

  let grid = '';
  for (let s = 0; s <= maxScore(); s++) {
    const left = per - usedElsewhere(s);
    const sel = my === s, out = left <= 0 && !sel;
    const note = sel ? '✓' : out ? 'esgotado' : (left === 1 ? 'resta 1' : 'restam ' + left);
    grid += `<button class="score${sel ? ' sel' : ''}" data-act="score" data-s="${s}" ${out ? 'disabled' : ''} aria-pressed="${sel}">
      <span class="n">${s}</span><span class="left">${note}</span></button>`;
  }

  let chips = '';
  for (let k = 1; k <= total; k++) {
    const v = mine[k];
    chips += `<button class="chip${v == null ? ' todo' : ''}${k === n ? ' active' : ''}" data-act="go" data-n="${k}">
      Vinho ${k}<b>${v == null ? '–' : v}</b></button>`;
  }

  return `${topBar(me)}
  <div class="label-wrap">
    <button class="arrow" data-act="go" data-n="${n - 1}" ${n <= 1 ? 'disabled' : ''} aria-label="Vinho anterior">‹</button>
    <div class="bottle-label"><div class="cap">Vinho</div><div class="num">${n}</div><div class="of">de ${total}</div></div>
    <button class="arrow" data-act="go" data-n="${n + 1}" ${n >= total ? 'disabled' : ''} aria-label="Vinho seguinte">›</button>
  </div>
  ${my == null ? '<p class="prompt">Toque na sua nota</p>' : `<div class="saved">Deu ${my} ao vinho ${n}</div>`}
  <div class="scores">${grid}</div>
  ${guessCard(n)}
  <div class="card">
    <h2>As suas notas · ${done} de ${total}</h2>
    <div class="chips">${chips}</div>
  </div>
  ${S.isHost ? hostTastingPanel() : ''}`;
}

/* --- reveal: everyone says which wine was in each bottle; the majority decides --- */
function revealView(me) {
  const total = S.event.total;
  const m = majority();
  const mine = S.reveals[S.guestId] || {};
  const voters = k => Object.keys(S.reveals).filter(gid => (S.reveals[gid] || {})[k]).length;
  const sameName = w => S.wines.some(o => o.id !== w.id && norm(o.name) === norm(w.name));
  const label = w => esc(w.name) + (sameName(w) ? ' (' + esc(broughtBy(w)) + ')' : '');

  let rows = '';
  for (let k = 1; k <= total; k++) {
    const pick = mine[k] || '';
    const opts = S.wines.map(o => {
      let at = 0; Object.keys(mine).forEach(b => { if (mine[b] === o.id && +b !== k) at = +b; });
      return `<option value="${esc(o.id)}"${pick === o.id ? ' selected' : ''}>${label(o)}${at ? ' · garrafa ' + at : ''}</option>`;
    }).join('');
    const win = m[k] && S.wines.find(w => w.id === m[k].wid);
    rows += `<div class="reveal-row"><span class="tag-num">${k}</span><div class="rv">
      <select data-reveal="${k}" aria-label="Que vinho estava na garrafa ${k}"><option value="">Que vinho é?</option>${opts}</select>
      <span class="sub">${win ? `<span class="majority">${label(win)}</span> · ${m[k].n} de ${plural(voters(k), 'voto', 'votos')}` : 'Sem votos'}</span>
    </div></div>`;
  }
  const left = bottlesWithoutMajority();
  return `${topBar(me)}${stage('A revelação', 'Que vinho estava em cada garrafa?')}
  <div class="card">${rows}</div>
  ${S.isHost ? `<div class="card">
      <button class="btn primary" style="margin-top:0" data-act="showResults" ${left.length ? 'disabled' : ''}>Mostrar resultados</button>
      <button class="textbtn" data-act="backToTasting">Voltar à prova</button></div>`
    : DEMO ? `<div class="card">
        <button class="btn primary" style="margin-top:0" data-act="showResults" ${left.length ? 'disabled' : ''}>Ver resultados</button></div>`
    : '<div class="waiting">Os resultados vêm já</div>'}`;
}

/* --- results --- */
function computeResults() {
  const rows = S.wines.filter(w => w.number).map(w => {
    const vals = Object.values(S.ratings).map(sc => sc[w.number]).filter(v => typeof v === 'number');
    const sum = vals.reduce((a, b) => a + b, 0);
    return Object.assign({}, w, { count: vals.length, total: sum, avg: vals.length ? sum / vals.length : null,
      min: vals.length ? Math.min(...vals) : null, max: vals.length ? Math.max(...vals) : null });
  });
  rows.sort((a, b) => (b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg) || a.number - b.number);
  rows.forEach(r => { r.rank = r.avg == null ? null : 1 + rows.filter(o => o.avg != null && o.avg > r.avg + 1e-9).length; });
  return rows;
}

function guessScore(gid) {
  let right = 0, tried = 0;
  const all = S.guesses[gid] || {};
  S.wines.filter(w => w.number).forEach(w => {
    const g = all[w.number] || {};
    FIELDS.forEach(f => { const j = judge(f.k, g[f.k], w); if (j) { tried++; if (j.ok) right++; } });
  });
  return { right, tried };
}

/* Numbers for the end of the night: [title, main line, detail]. */
function nightStats(rows) {
  const out = [];
  const numbered = rows.filter(r => r.count);
  const people = S.guests.map(g => {
    const sc = S.ratings[g.id] || {}, vals = numbered.map(r => sc[r.number]).filter(v => typeof v === 'number');
    return { g, sc, vals, avg: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null };
  }).filter(p => p.vals.length);
  const namesOf = list => listPt(list.map(p => esc(p.g.name)));

  if (people.length >= 2) {
    const hi = Math.max(...people.map(p => p.avg)), lo = Math.min(...people.map(p => p.avg));
    if (hi - lo > 1e-9) {
      out.push(['Mais generoso', namesOf(people.filter(p => Math.abs(p.avg - hi) < 1e-9)), 'média ' + fmt(hi)]);
      out.push(['Mais exigente', namesOf(people.filter(p => Math.abs(p.avg - lo) < 1e-9)), 'média ' + fmt(lo)]);
    }
    // Two people whose scores differ the least, over the wines both scored
    let best = null;
    for (let i = 0; i < people.length; i++) for (let j = i + 1; j < people.length; j++) {
      const common = numbered.filter(r => typeof people[i].sc[r.number] === 'number' && typeof people[j].sc[r.number] === 'number');
      if (common.length < 2) continue;
      const diff = common.reduce((a, r) => a + Math.abs(people[i].sc[r.number] - people[j].sc[r.number]), 0) / common.length;
      if (!best || diff < best.diff) best = { diff, a: people[i], b: people[j] };
    }
    if (best) out.push(['Gostos parecidos', esc(best.a.g.name) + ' e ' + esc(best.b.g.name), 'diferença média de ' + fmt(best.diff).replace(/,00$/, '')]);
  }

  const spread = numbered.filter(r => r.count >= 2);
  if (spread.length >= 2) {
    const calm = spread.slice().sort((a, b) => (a.max - a.min) - (b.max - b.min) || b.avg - a.avg)[0];
    const wild = spread.slice().sort((a, b) => (b.max - b.min) - (a.max - a.min) || b.avg - a.avg)[0];
    if (calm !== wild && wild.max - wild.min > calm.max - calm.min) {
      out.push(['Mais consensual', esc(calm.name), calm.min === calm.max ? 'todos deram ' + calm.min : 'notas de ' + calm.min + ' a ' + calm.max]);
      out.push(['Mais polémico', esc(wild.name), 'notas de ' + wild.min + ' a ' + wild.max]);
    }
  }

  const all = people.flatMap(p => p.vals);
  if (all.length) {
    const freq = {};
    all.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
    const top = Math.max(...Object.values(freq));
    const common = Object.keys(freq).filter(v => freq[v] === top).map(Number).sort((a, b) => b - a);
    out.push(['Nota mais dada', listPt(common.map(String)), plural(top, 'vez', 'vezes')]);
    out.push(['Pontos da noite', String(all.reduce((a, b) => a + b, 0)), plural(all.length, 'nota', 'notas')]);
  }

  // Blind, but did anyone fall for their own bottle?
  let self = null;
  numbered.forEach(r => owners(r).forEach(gid => {
    const v = (S.ratings[gid] || {})[r.number];
    if (typeof v === 'number' && (!self || v > self.v)) self = { v, gid, r };
  }));
  if (self && self.v >= 7) out.push(['Gostou do próprio vinho', esc(guestName(self.gid)), 'deu ' + self.v + ' ao seu ' + esc(self.r.name)]);
  return out;
}

// Short column names for the grades table: first names, plus an initial when two people share one.
function shortNames(list) {
  const count = {};
  list.forEach(g => { const f = norm(firstName(g.name)); count[f] = (count[f] || 0) + 1; });
  const out = {};
  list.forEach(g => {
    const parts = String(g.name || '').trim().split(/\s+/);
    out[g.id] = count[norm(parts[0])] > 1 && parts[1] ? parts[0] + ' ' + parts[1][0] + '.' : parts[0];
  });
  return out;
}

function gradesFor(r) {
  return S.guests.map(g => ({ g, v: (S.ratings[g.id] || {})[r.number] })).filter(x => typeof x.v === 'number')

}

/* Every grade, organised: one row per wine (in ranking order), one column per person. */
function gradesTab(rows) {
  const people = S.guests.filter(g => rows.some(r => typeof (S.ratings[g.id] || {})[r.number] === 'number'));
  const short = shortNames(people);
  // A gold ring marks the grade each person gave to the wine they brought.
  const cell = (v, own) => `<td class="v"><span class="pip ${typeof v !== 'number' ? 'none' : v >= 9 ? 'v3' : v >= 7 ? 'v2' : v >= 4 ? 'v1' : 'v0'}${own ? ' own' : ''}"${own ? ' title="Vinho que trouxe"' : ''}>${typeof v === 'number' ? v : '–'}</span></td>`;
  const anyOwn = rows.some(r => people.some(g => owns(r, g.id) && typeof (S.ratings[g.id] || {})[r.number] === 'number'));
  const given = g => {
    const vals = rows.map(r => (S.ratings[g.id] || {})[r.number]).filter(v => typeof v === 'number');
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  // Two side-by-side blocks with identical fixed row heights: the wine names stay still and only the grades
  // scroll sideways. No "sticky" cells, so nothing can slide over or under anything else while scrolling.
  return `<div class="card"><div class="gt">
    <div class="gt-left">
      <div class="gt-head"></div>
      ${rows.map(r => `<div class="gt-row gt-name"><span class="wn">${esc(r.name)}</span>
        <span class="wo">de ${esc(listPt(owners(r).map(id => firstName(guestName(id)))))}</span></div>`).join('')}
      <div class="gt-foot">Média dada</div>
    </div>
    <div class="gt-right"><table class="gt-table">
      <thead><tr class="gt-head">${people.map(g => `<th class="${g.id === S.guestId ? 'me' : ''}" title="${esc(g.name)}">${esc(short[g.id])}</th>`).join('')}<th class="acol">Média</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="gt-row">${people.map(g => cell((S.ratings[g.id] || {})[r.number], owns(r, g.id))).join('')}<td class="acol">${fmt(r.avg)}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="gt-foot">${people.map(g => `<td>${fmt(given(g))}</td>`).join('')}<td class="acol"></td></tr></tfoot>
    </table></div>
  </div>
  ${anyOwn ? '<p class="legend"><span class="pip v1 own sw"></span>Vinho que a pessoa trouxe</p>' : ''}</div>`;

/* Everyone's guesses, wine by wine: right answers in green, wrong ones crossed out. */
function guessesTab(rows, guessers) {
  const order = ['name', 'country', 'region', 'year', 'abv', 'grapes'];
  const shown = (k, v) => k === 'abv' ? abvText(v) : k === 'name' ? '“' + v + '”' : v;
  const line = (g, w) => {
    const gs = (S.guesses[g.id] || {})[w.number] || {};
    const parts = order.filter(k => gs[k] && String(gs[k]).trim()).map(k => {
      const j = judge(k, gs[k], w);
      return !j ? `<span>${esc(shown(k, gs[k]))}</span>`
        : `<span class="${j.ok ? 'hit' : 'miss'}">${esc(shown(k, gs[k]))}${j.ok ? ' ✓' : ''}</span>`;
    });
    return parts.length ? `<div class="gp"><span class="gn">${esc(g.name)}</span><span class="gv">${parts.join(' · ')}</span></div>` : '';
  };
  const wines = rows.slice().sort((a, b) => a.number - b.number).map(w => {
    const lines = S.guests.map(g => line(g, w)).join('');
    return lines ? `<div class="gwine">
      <div class="gw-head"><span class="tag-num sm">${w.number}</span><div><b>${esc(w.name)}</b>
        ${factsLine(w) ? `<span class="sub">${esc(factsLine(w))}</span>` : ''}</div></div>
      ${lines}</div>` : '';
  }).join('');
  return `<div class="card"><h2>Acertos</h2>
    ${guessers.map(x => `<div class="nrow"><span>${esc(x.g.name)}</span><b>${x.right} de ${x.tried}</b></div>`).join('')}</div>
  <div class="card">${wines}</div>`;
}

function screen() {
  if (!fs) return `<div class="center" style="margin-top:30vh"><p class="lead">Sem ligação à internet.</p>
    <button class="btn primary" data-act="reload">Tentar outra vez</button></div>`;

    if (S.view === 'hostLogin' && S.canCreate) return hostLoginView();
    return homeView();

  return setupView(me);
}

/* ---------- rendering ---------- */
// Typed-in fields (marked data-keep) and the "who brought it" choices survive live redraws.
function captureDraft() {
  const d = { fields: {} };
  $app.querySelectorAll('[data-keep]').forEach(el => { if (el.id) d.fields[el.id] = el.value; });
  const p = document.getElementById('newOwners');
  if (p) d.owners = Array.from(p.querySelectorAll('.pill.on')).map(b => b.dataset.gid);
  return d;
}
function restoreDraft(d) {
  Object.keys(d.fields).forEach(id => { const el = document.getElementById(id); if (el && el.hasAttribute('data-keep')) el.value = d.fields[id]; });
  const p = document.getElementById('newOwners');
  if (p && d.owners) p.querySelectorAll('.pill').forEach(b => {
    const on = d.owners.indexOf(b.dataset.gid) >= 0;
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
  });
}

function render(force) {
  const ae = document.activeElement;
  // Don't wipe what someone is typing; redraw once they leave the box.
  if (!force && ae && $app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) {
    if (!S.pending) {
      S.pending = true;
      ae.addEventListener('blur', () => setTimeout(() => { if (S.pending) { S.pending = false; render(); } }, 350), { once: true });
    }
    return;
  }
  S.pending = false;
  if (force && ae && ae.blur && $app.contains(ae)) ae.blur();
  const key = S.code ? 'ev:' + S.code + ':' + (S.event ? S.event.phase : '') : 'v:' + S.view;
  const draft = key === S.lastKey && !S.clearDraft ? captureDraft() : null;
  S.lastKey = key; S.clearDraft = false;
  let html;
  try { html = view(); } catch (err) {
    // Unexpected data must never leave a blank screen.
    console.error(err);
    html = `<div class="center" style="margin-top:30vh"><p class="lead">Algo correu mal.</p>
      <button class="btn primary" data-act="reload">Recarregar</button></div>`;
  }
  $app.innerHTML = html;
  if (draft) restoreDraft(draft);
  const qr = document.getElementById('qr');
  if (qr && window.QRCode) {
    try { new QRCode(qr, { text: location.origin + location.pathname + '?e=' + S.code, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
  }
  syncWakeLock();
}

// One action at a time (no double taps); a stuck action never blocks the buttons for more than 15 s.
let busy = false, actionSeq = 0;
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled || busy) return;
  const fn = A[b.dataset.act];
  if (!fn) return;
  const seq = ++actionSeq;
  busy = true;
  const release = setTimeout(() => { if (actionSeq === seq) busy = false; }, 15000);
  Promise.resolve().then(() => fn(b.dataset, b)).catch(err => {
    console.error(err);
    toast(err && err.message === 'timeout' ? 'Sem ligação. Tente outra vez.' : 'Não funcionou. Verifique a internet.');
  }).finally(() => { clearTimeout(release); if (actionSeq === seq) busy = false; });
});
$app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.enter) return;
  e.preventDefault();
  const btn = $app.querySelector('[data-act="' + e.target.dataset.enter + '"]');
  if (btn) btn.click();
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.reveal) {
    saveRevealVote(parseInt(t.dataset.reveal, 10), t.value || null);
    render(true);
  } else if (t.hasAttribute('data-guess')) {
    const box = t.closest('[data-guess-for]');
    if (box) saveGuess(parseInt(box.dataset.guessFor, 10));
  }
});
window.addEventListener('unhandledrejection', e => console.error(e.reason));

/* ---------- demo: everything lives in this phone's memory, with virtual guests ---------- */
function memoryDb(onChange) {
  const store = new Map(), listeners = new Set();
  const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
  const merge = (a, b) => {
    const r = Object.assign({}, a);
    Object.keys(b).forEach(k => { r[k] = b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && r[k] && typeof r[k] === 'object' ? merge(r[k], b[k]) : b[k]; });
    return r;
  };
  const kids = p => Array.from(store.keys()).filter(k => k.indexOf(p + '/') === 0 && k.slice(p.length + 1).indexOf('/') < 0);
  let queued = false;
  const changed = () => {
    if (queued) return; queued = true;
    setTimeout(() => { queued = false; listeners.forEach(l => l()); if (onChange) onChange(); }, 0);
  };
  const apply = o => {
    if (o.t === 'set') store.set(o.p, o.merge && store.has(o.p) ? merge(store.get(o.p), clone(o.d)) : clone(o.d));
    else if (o.t === 'update') { if (!store.has(o.p)) throw new Error('not found: ' + o.p); store.set(o.p, Object.assign({}, store.get(o.p), clone(o.d))); }
    else store.delete(o.p);
  };
  const write = ops => { try { ops.forEach(apply); } catch (e) { return Promise.reject(e); } changed(); return Promise.resolve(); };
  const snap = p => ({ id: p.split('/').pop(), exists: store.has(p), data: () => clone(store.get(p)) });
  const watch = (read, cb) => {
    let last;
    const l = () => { const s = JSON.stringify(read()); if (s !== last) { last = s; cb(); } };
    listeners.add(l); setTimeout(l, 0);
    return () => listeners.delete(l);
  };
  function doc(p) {
    return {
      id: p.split('/').pop(), path: p,
      collection: n => col(p + '/' + n),
      get: () => Promise.resolve(snap(p)),
      set: (d, o) => write([{ t: 'set', p, d, merge: !!(o && o.merge) }]),
      update: d => write([{ t: 'update', p, d }]),
      delete: () => write([{ t: 'delete', p }]),
      onSnapshot: cb => watch(() => store.get(p) || null, () => cb(snap(p)))
    };
  }
  function col(p) {
    const c = {
      doc: id => doc(p + '/' + (id || Math.random().toString(36).slice(2, 12))),
      add: d => { const r = c.doc(); return r.set(d).then(() => r); },
      get: () => Promise.resolve({ docs: kids(p).map(snap) }),
      onSnapshot: cb => watch(() => kids(p).map(k => [k, store.get(k)]), () => cb({ docs: kids(p).map(snap) }))
    };
    return c;
  }
  return {
    collection: n => col(n),
    batch() {
      const ops = [];
      return {
        set(r, d, o) { ops.push({ t: 'set', p: r.path, d, merge: !!(o && o.merge) }); },
        update(r, d) { ops.push({ t: 'update', p: r.path, d }); },
        delete(r) { ops.push({ t: 'delete', p: r.path }); },
        commit: () => write(ops)
      };
    }
  };
}

/* The demo drops the visitor straight into a tasting that is already running, as a guest, next to four
   virtual people who have already voted. Everything lives in this phone's memory; nothing reaches Firebase. */
const Demo = {
  me: 'Convidado', host: 'Manuel', people: ['Ana', 'Rui', 'Teresa'],
  wines: [
    { name: 'Douro Reserva', owners: ['Ana'], country: 'Portugal', region: 'Douro', year: '2019', abv: '14', grapes: 'Touriga Nacional, Touriga Franca' },
    { name: 'Alentejo Tinto', owners: ['Rui'], country: 'Portugal', region: 'Alentejo', year: '2021', abv: '14,5', grapes: 'Aragonez, Trincadeira, Alicante Bouschet' },
    { name: 'Dão Colheita', owners: ['Teresa'], country: 'Portugal', region: 'Dão', year: '2018', abv: '13,5', grapes: 'Touriga Nacional, Alfrocheiro' },
    { name: 'Bairrada Baga', owners: ['Manuel'], country: 'Portugal', region: 'Bairrada', year: '2017', abv: '13', grapes: 'Baga' },
    { name: 'Alvarinho', owners: ['Ana', 'Rui'], country: 'Portugal', region: 'Vinho Verde', year: '2023', abv: '12,5', grapes: 'Alvarinho' }
  ],
  ids: {}, bottles: {}, finished: false, revealed: false,

  async start() {
    fs = memoryDb(() => Demo.tick());
    Demo.finished = Demo.revealed = false;
    const ev = fs.collection('events').doc('DEMO');
    const names = [Demo.host].concat(Demo.people, [Demo.me]), ids = Demo.ids = {};
    names.forEach(n => { ids[n] = ev.collection('guests').doc().id; });
    const total = Demo.wines.length;
    let t = Date.now();
    await ev.set({ createdAt: t, hostPin: '', hostGuest: ids[Demo.host], phase: 'tasting', total, maxScore: MAX_SCORE, perScore: PER_SCORE });
    for (const n of names) await ev.collection('guests').doc(ids[n]).set({ name: n, joinedAt: t++ });
    // The bottles were shuffled and numbered by hand; only the virtual people know which is which.
    const order = shuffle(Demo.wines.map((w, i) => i));
    Demo.bottles = {};
    for (let i = 0; i < total; i++) {
      const w = Demo.wines[i], gids = w.owners.map(o => ids[o]), ref = ev.collection('wines').doc();
      await ref.set({ name: w.name, country: w.country, region: w.region, year: w.year, abv: w.abv, grapes: w.grapes,
        guestId: gids[0], guestIds: gids, number: null, createdAt: t++ });
      Demo.bottles[order.indexOf(i) + 1] = Object.assign({ id: ref.id }, w);
    }
    for (const n of [Demo.host].concat(Demo.people)) await ev.collection('ratings').doc(ids[n]).set(Demo.ballot(total));
    enterEvent('DEMO', ids[Demo.me], null);
  },

  // Scores (each at most twice) and guesses, some right and some wrong.
  ballot(total) {
    const pool = shuffle([3, 4, 5, 6, 7, 8, 9, 10].flatMap(x => [x, x])).concat(shuffle([0, 1, 2, 0, 1, 2]));
    const pick = (real, list, p) => Math.random() < p ? real : list[Math.floor(Math.random() * list.length)];
    const names = Demo.wines.map(w => w.name);
    const scores = {}, guesses = {};
    for (let k = 1; k <= total; k++) {
      const w = Demo.bottles[k];
      scores[k] = pool[k - 1];
      guesses[k] = {
        name: Math.random() < 0.5 ? pick(w.name, names, 0.5) : '',
        country: pick(w.country, ['Portugal', 'Espanha', 'França'], 0.8),
        region: pick(w.region, ['Douro', 'Alentejo', 'Dão', 'Bairrada', 'Lisboa'], 0.4),
        year: String(parseInt(w.year, 10) + (Math.random() < 0.4 ? 0 : 1)),
        abv: pick(w.abv, ['12,5', '13', '14'], 0.5), grapes: pick(w.grapes, ['Touriga Nacional', 'Baga', 'Castelão', 'Aragonez'], 0.5)
      };
    }
    return { scores, guesses };
  },

  // Once the visitor has scored every wine, the virtual host ends the tasting; at the reveal the others vote.
  tick() {
    const e = S.event;
    if (!e) return;
    if (e.phase === 'tasting' && !Demo.finished) {
      const mine = myScores();
      for (let k = 1; k <= e.total; k++) if (mine[k] == null) return;
      Demo.finished = true;
      toast('Votou em todos. A prova vai terminar.', 'ok');
      setTimeout(() => fs.collection('events').doc('DEMO').update({ phase: 'reveal' }), 3500);
    }
    if (e.phase === 'reveal' && !Demo.revealed) {
      Demo.revealed = true;
      setTimeout(async () => {
        const voters = [Demo.host].concat(Demo.people);
        for (let i = 0; i < voters.length; i++) {
          const map = {};
          for (let k = 1; k <= e.total; k++) map[k] = Demo.bottles[k].id;
          if (voters[i] === 'Teresa') { const x = map[1]; map[1] = map[2]; map[2] = x; } // one mix-up; the majority fixes it
          await fs.collection('events').doc('DEMO').collection('ratings').doc(Demo.ids[voters[i]]).set({ reveal: map }, { merge: true });
        }
      }, 1500);
    }
  }
};

/* ---------- start ---------- */
/* Phones and GitHub keep old copies of this page for a while. version.txt is always fetched fresh; if it names
   a newer version than this page, reload once with ?v=<version>, an address no cache has seen yet.
   On a slow connection the check gives up after a few seconds rather than delaying the app. */
async function isOutdated() {
  try {
    const ctl = 'AbortController' in window ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 4000);
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    clearTimeout(t);
    if (!r.ok) return false;
    const latest = (await r.text()).trim();
    if (!latest || latest === APP_VERSION || PARAMS.get('v') === latest) return false;
    PARAMS.set('v', latest);
    location.replace(location.pathname + '?' + PARAMS.toString());
    return true;
  } catch (e) { return false; }
}

(async function init() {
  if (await isOutdated()) return;
  if (DEMO) { try { await Demo.start(); } catch (e) { console.error(e); render(true); } return; }
  if (!window.firebase) { render(true); return; }
  firebase.initializeApp(firebaseConfig);
  fs = firebase.firestore();
  // Some routers, mobile networks and antivirus proxies hold back Firestore's streaming connection,
  // so live updates never arrive. Long polling works everywhere and is plenty fast for a dinner table.
  fs.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, experimentalLongPollingOptions: { timeoutSeconds: 10 }, merge: true });

  // Only the host link (?anfitriao=<secret>) can create tastings. The plain link only joins one with a code.
  const key = PARAMS.get('anfitriao');
  try { if (key && await sha256(key) === HOST_HASH) { S.hostKey = key; S.canCreate = true; } } catch (e) {}

  // The QR code or a reload names the tasting: go straight back in if this phone was already in it.
  const urlCode = (PARAMS.get('e') || '').toUpperCase().replace(/[^A-Z]/g, '');
  const saved = loadSession();
  if (urlCode.length === 4 && saved && saved.code === urlCode) {
    enterEvent(saved.code, saved.guestId, saved.hostPin);
  } else if (urlCode.length === 4) {
    S.joinCode = urlCode; S.view = 'join'; setUrl(urlCode); render(true);
  } else {
    setUrl(null); render(true);
  }
})();
</script>
